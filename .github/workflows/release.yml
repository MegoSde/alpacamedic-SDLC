
name: Staging Release

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

          curl -sSfL https://get.anchore.io/syft \
            | sudo sh -s -- -b /usr/local/bin

          curl -sSfL https://get.anchore.io/grype \
            | sudo sh -s -- -b /usr/local/bin

      - name: Build release candidate
        run: |
          mkdir -p reports

          podman build --pull=always --no-cache \
            -t localhost/receptionist:${{ github.sha }} \
            -f apps/receptionist/Containerfile \
            apps/receptionist/

          podman save --format oci-archive \
            -o reports/receptionist.oci.tar \
            localhost/receptionist:${{ github.sha }}

      - name: Generate SBOM
        run: |
          syft scan oci-archive:reports/receptionist.oci.tar \
            -o cyclonedx-json=reports/receptionist.sbom.json

      - name: Grype security gate
        run: |
          grype sbom:reports/receptionist.sbom.json \
            -o json > reports/grype.json

          grype sbom:reports/receptionist.sbom.json \
            --fail-on critical

      - name: Publish to GHCR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/receptionist"
          TAG="rc-${GITHUB_SHA}"

          podman tag \
            localhost/receptionist:${GITHUB_SHA} \
            "$IMAGE:$TAG"

          podman push --digestfile /tmp/digest.txt \
            "$IMAGE:$TAG"

          DIGEST=$(cat /tmp/digest.txt)
          REF="$IMAGE@$DIGEST"

          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "$REF" > reports/release-image.txt
          echo "$GITHUB_SHA" > reports/staging-commit.txt

          echo "### Release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-evidence
          path: |
            reports/receptionist.sbom.json
            reports/grype.json
            reports/release-image.txt
            reports/staging-commit.txt
          if-no-files-found: warn
          retention-days: 30

  staging:
    name: Staging - ZAP
    needs: release
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.release.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$IMAGE"

      - name: Start staging application
        env:
          IMAGE: ${{ needs.release.outputs.image }}
        run: |
          docker network create staging-net

          docker run -d \
            --name receptionist \
            --network staging-net \
            "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if docker exec receptionist /venv/bin/python \
              -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200"; then
              exit 0
            fi
            sleep 2
          done

          docker logs receptionist
          exit 1

      - name: OWASP ZAP Baseline
        run: |
          mkdir -p reports
          chmod 777 reports

          docker run --rm \
            --network staging-net \
            -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://receptionist:8000/health \
              -m 1 \
              -I \
              -r zap-report.html \
              -J zap-report.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-zap-reports
          path: reports/
          retention-days: 30

      - name: Application logs on failure
        if: failure()
        run: docker logs receptionist

