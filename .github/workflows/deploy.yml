
name: Development to Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

          curl -sSfL https://get.anchore.io/syft \
            | sudo sh -s -- -b /usr/local/bin

          curl -sSfL https://get.anchore.io/grype \
            | sudo sh -s -- -b /usr/local/bin

      - name: Build image
        run: |
          mkdir -p reports

          podman build --pull=always --no-cache \
            -t localhost/receptionist:${{ github.sha }} \
            -f apps/receptionist/Containerfile \
            apps/receptionist/

          podman save --format oci-archive \
            -o reports/receptionist.oci.tar \
            localhost/receptionist:${{ github.sha }}

      - name: Generate SBOM
        run: |
          syft scan oci-archive:reports/receptionist.oci.tar \
            -o cyclonedx-json=reports/receptionist.sbom.json

      - name: Scan vulnerabilities
        run: |
          grype sbom:reports/receptionist.sbom.json \
            -o json > reports/grype.json

          grype sbom:reports/receptionist.sbom.json \
            --fail-on critical

      - name: Publish to GHCR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/receptionist"

          podman tag \
            localhost/receptionist:${{ github.sha }} \
            "$IMAGE:${{ github.sha }}"

          podman push \
            --digestfile /tmp/image-digest.txt \
            "$IMAGE:${{ github.sha }}"

          DIGEST=$(cat /tmp/image-digest.txt)
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-security-reports
          path: |
            reports/receptionist.sbom.json
            reports/grype.json
          retention-days: 30

  staging:
    name: Staging - OWASP ZAP
    needs: publish
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull approved image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$IMAGE"

      - name: Start staging application
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          docker network create staging-net

          docker run -d \
            --name receptionist \
            --network staging-net \
            "$IMAGE"

      - name: Run OWASP ZAP Baseline
        run: |
          mkdir -p reports
          chmod 777 reports

          docker run --rm \
            --network staging-net \
            -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://receptionist:8700 \
              -m 1 \
              -I \
              -r zap-report.html \
              -J zap-report.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-zap-reports
          path: reports/
          retention-days: 30

      - name: Show application logs
        if: failure()
        run: docker logs receptionist

